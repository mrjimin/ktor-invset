ktor:
  application:
    modules:
      - io.github.mrjimin.invest.ApplicationKt.module
  deployment:
    port: 8080

database:
  driverClassName: "org.postgresql.Driver"
  url: "jdbc:postgresql://localhost:5432/invest"
  username: "invest"
  password: "$DB_PASSWORD"

  maxPoolSize: 10

  cachePrepStmts: true
  prepStmtCacheSize: 250
  prepStmtCacheSqlLimit: 2048

  migrations:
    locations: "classpath:db/migration"
    baselineOnMigrate: false

jwt:
  secret: "$JWT_SECRET"
  issuer: "invest-server"
  audience: "invest-users"
  accessExpirationMs: 1800000
  refreshExpirationMs: 604800000