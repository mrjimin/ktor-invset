services:
  postgres:
    image: postgres:17-alpine
    container_name: invest-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: invest
      POSTGRES_USER: invest
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invest -d invest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
